name: Active task alerts

# Vercel Hobby only allows once-per-day crons, so the hourly 18:30 → 23:30
# Asia/Dhaka reminders are driven from here instead. Times below are UTC (+6).
on:
  schedule:
    - cron: '30 12-17 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron-active-task
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set the APP_URL and CRON_SECRET repository secrets." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron-active-task"
